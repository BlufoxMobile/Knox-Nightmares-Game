<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Knox — world test</title>
<script type="importmap">
{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }
</script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
  #info { position: fixed; left: 8px; top: 6px; color: #9aa; font: 12px/1.4 monospace; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #ctl { position: fixed; right: 8px; top: 6px; display: flex; gap: 6px; }
  #ctl button { background: #222; color: #ddd; border: 1px solid #444; font: 12px monospace; padding: 4px 8px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="info"></div>
<div id="ctl"></div>
<script type="module">
import * as THREE from 'three';
import { Renderer } from '../src/render/renderer.js';
import { Sky } from '../src/render/sky.js';
import { Lighting } from '../src/render/lighting.js';
import { Particles } from '../src/render/particles.js';
import { Decals } from '../src/render/decals.js';
import { FOG, patchFog } from '../src/render/fx.js';
import { triCount } from '../src/game/worlds/common.js';

const q = new URLSearchParams(location.search);
const worldName = q.get('w') || 'forest'; const tierName = q.get('tier') || 'high';
const mod = await import(`../src/game/worlds/${worldName}.js`);
const THEME = mod.THEME;

const canvas = document.getElementById('gl');
const renderer = new Renderer(canvas); renderer.setTier(tierName); const tier = renderer.tier;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 400);
const sky = new Sky(); scene.add(sky.mesh);
const lighting = new Lighting(renderer, scene, sky); lighting.setShadowSize(tier.shadow);
sky.apply(THEME.sky); lighting.apply(THEME.rig);
const g = THEME.grade; renderer.grade.exposure = g.exposure; renderer.grade.lift.fromArray(g.lift); renderer.grade.gain.fromArray(g.gain); renderer.grade.saturation = g.saturation; renderer.grade.contrast = g.contrast; renderer.grade.bloom = g.bloom; renderer.grade.vignette = g.vignette;
renderer.fx.fade = 0; renderer.fx.underwater = THEME.underwater ? 1 : 0;
const particlesAdd = new Particles(scene, tier.particles, true), particlesAlpha = new Particles(scene, tier.particles, false); const decals = new Decals(scene, tier.decals);

// dummy Knox capsule at the origin
const dummy = new THREE.Mesh(new THREE.CapsuleGeometry(0.32, 1.05, 4, 10), patchFog(new THREE.MeshStandardMaterial({ color: 0x3a6cff, roughness: .6 })));
dummy.position.y = 0.85; dummy.castShadow = true; dummy.receiveShadow = true; scene.add(dummy);

const ctx = { scene, camera, renderer, sky, lighting, particlesAdd, particlesAlpha, decals, time: 0 };
const world = mod.build(ctx, tier); scene.add(world.group); window.__world = world; window.__ctx = ctx; window.__THREE = THREE;
if (world.bedPos) dummy.position.set(world.bedPos.x, world.bedPos.y + 0.35, world.bedPos.z), dummy.rotation.x = Math.PI / 2;
const playerPos = new THREE.Vector3(0, 0, 0); if (world.bedPos) playerPos.set(0.2, 0.2, 0.2);

let t = 0; const cam = { yaw: +(q.get('yaw') || 0.6), pitch: +(q.get('pitch') || -0.12), dist: +(q.get('dist') || (world.bedPos ? 1.6 : 4.6)), height: +(q.get('h') || (world.bedPos ? 1.5 : 1.9)) };
const fwd = new THREE.Vector3();
function placeCamera() {
  const pivot = new THREE.Vector3(playerPos.x, playerPos.y + 1.3, playerPos.z);
  camera.position.set(pivot.x - Math.sin(cam.yaw) * cam.dist, playerPos.y + cam.height, pivot.z - Math.cos(cam.yaw) * cam.dist);
  const look = pivot.clone().add(new THREE.Vector3(Math.sin(cam.yaw), Math.tan(cam.pitch) * 3, Math.cos(cam.yaw)).multiplyScalar(3));
  camera.lookAt(look); camera.getWorldDirection(fwd);
}
function step(dt) {
  t += dt; ctx.time = t; FOG.time.value = t;
  world.update(dt, t, playerPos); sky.update(t, camera.position); lighting.update(playerPos, fwd); particlesAdd.update(dt); particlesAlpha.update(dt); decals.update(dt);
}
function frame() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.resize();
  placeCamera(); renderer.render(scene, camera, t);
}
// pre-roll so ambient particles exist
for (let i = 0; i < 240; i++) step(1 / 30);
frame();
const info = renderer.gl.info.render;
const tris = triCount(world.group);
document.getElementById('info').textContent = `${worldName} · ${tierName} · calls ${info.calls} · tris ${info.triangles} · world geo tris ${tris}`;
window.__info = () => ({ calls: info.calls, triangles: info.triangles, worldTris: tris, points: info.points, lines: info.lines });
window.__shot = (o = {}) => { Object.assign(cam, o); for (let i = 0; i < (o.steps || 6); i++) step(1 / 30); frame(); return window.__info(); };
window.__ready = true;

// interactive: orbit with drag, auto-orbit when idle
let auto = !q.has('yaw'), last = performance.now(), drag = null;
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; auto = false; });
addEventListener('pointermove', e => { if (!drag) return; cam.yaw -= (e.clientX - drag.x) * .006; cam.pitch = Math.max(-.6, Math.min(.6, cam.pitch - (e.clientY - drag.y) * .004)); drag = { x: e.clientX, y: e.clientY }; });
addEventListener('pointerup', () => drag = null);
const ctl = document.getElementById('ctl');
for (const [label, fn] of [['blackout', () => world.blackout(world._bo = world._bo ? 0 : 1)], ['lightning', () => world.lightning()], ['lamp off', () => world.lampsOff((world._lo = (world._lo || 0) + 1))], ['blackwater', () => world.blackwater(world._bw = world._bw ? 0 : 1)], ['eyes', () => world.eyes(world._ey = world._ey === 0 ? 1 : 0)], ['trophies', () => world.trophies && world.trophies((world._tr = ((world._tr || 0) + 1) % 4))]]) { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; ctl.appendChild(b); }
if (!q.has('static')) (function loop() { const now = performance.now(); const dt = Math.min(0.05, (now - last) / 1000); last = now; if (auto) cam.yaw += dt * 0.15; step(dt); frame(); document.getElementById('info').textContent = `${worldName} · ${tierName} · calls ${info.calls} · tris ${info.triangles}`; requestAnimationFrame(loop); })();
</script>
</body>
</html>
